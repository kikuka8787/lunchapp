<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학교평가 보고서 메이커</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #f3f5fa; --card: #ffffff; --text: #1d2433; --muted: #6b7385; --border: #dfe3ec;
    --primary: #2b44c9; --primary-soft: #e8ecfb; --primary-text: #ffffff;
    --ok: #13895f; --warn: #b8650a; --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Noto Sans KR", "Malgun Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5; font-size: 15px;
    display: flex; flex-direction: column;
  }
  button {
    min-height: 40px; padding: 0 14px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--primary); color: var(--primary-text); font: inherit; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
  button.soft { background: var(--primary-soft); color: var(--primary); }
  button.small { min-height: 32px; padding: 0 10px; font-size: 13px; }
  input, select, textarea {
    width: 100%; padding: 8px 10px; font: inherit; color: var(--text); background: #fff;
    border: 1px solid var(--border); border-radius: 8px; min-height: 40px;
  }
  textarea { resize: vertical; min-height: 72px; line-height: 1.55; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #b9c5f5; border-color: var(--primary); }
  label { font-weight: 600; font-size: 14px; }

  /* 상단 */
  .top {
    background: var(--primary); color: #fff; padding: 10px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex-shrink: 0;
  }
  .top .brand { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
  .top h1 { font-size: 19px; margin: 0; }
  .madeby { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; }
  .madeby span { opacity: .8; margin-right: 2px; }
  .madeby a { padding: 3px 12px; border-radius: 999px; color: #fff; text-decoration: none; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .madeby .mb-home { background: #1a2a99; border: 1px solid #8fa2f0; }
  .madeby .mb-home:hover { background: #121f78; }
  .madeby .mb-insta { background: linear-gradient(90deg, #a855f7, #ec4899); }
  .madeby .mb-insta:hover { background: linear-gradient(90deg, #9333ea, #db2777); }
  .madeby .mb-site { background: #fff; color: var(--primary); border: 1px solid #dfe3ec; }
  .madeby .mb-site:hover { background: #f1f3f8; }
  .top h1 small { font-weight: 400; opacity: .8; font-size: 13px; margin-left: 6px; }
  .top .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .top button { background: rgba(255,255,255,.16); }
  .top button.main { background: #fff; color: var(--primary); }
  .menu { position: relative; }
  .menu-list {
    position: absolute; right: 0; top: 46px; background: #fff; border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.15); padding: 6px; z-index: 30;
    display: none; min-width: 190px;
  }
  .menu-list.show { display: block; }
  .menu-list button { width: 100%; justify-content: flex-start; background: transparent; color: var(--text); font-weight: 500; }
  .menu-list button:hover { background: var(--primary-soft); }

  #progress { height: 4px; background: transparent; flex-shrink: 0; }
  #progress .bar { height: 100%; width: 0; background: #ffb020; transition: width .3s; }
  #status { font-size: 13px; color: var(--muted); padding: 4px 16px; flex-shrink: 0; min-height: 26px; }
  #status.err { color: #c0322b; font-weight: 600; }

  /* 본문 2단 */
  .layout { flex: 1; display: flex; min-height: 0; }
  .editor {
    width: 46%; min-width: 380px; max-width: 640px; background: #fff; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  #tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px; border-bottom: 1px solid var(--border); }
  .tab {
    min-height: 32px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: #f1f3f8; color: var(--text); border: 1px solid transparent;
  }
  .tab.on { background: var(--primary); color: #fff; }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: #c6cbd8; display: inline-block; }
  .tab .dot.half { background: #f0a020; }
  .tab .dot.done { background: #19a974; }
  .tab.on .dot { box-shadow: 0 0 0 2px #fff; }
  #form { flex: 1; overflow-y: auto; padding: 16px 16px 60px; }
  .preview-wrap { flex: 1; overflow-y: auto; padding: 20px; min-width: 0; }

  .card { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; background: #fff; }
  .card h3 { margin: 0 0 10px; font-size: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h3 .badge { margin-left: auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .hint { font-size: 12.5px; color: var(--muted); }
  .badge { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); }
  .ind-head { background: linear-gradient(90deg, #2b44c9, #5b74e6); color: #fff; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
  .ind-head .code { font-size: 13px; opacity: .85; }
  .ind-head .title { font-size: 18px; font-weight: 800; margin: 2px 0 6px; }
  .ind-head .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .ind-head .meta span { background: rgba(255,255,255,.18); padding: 2px 10px; border-radius: 999px; }
  .ind-head details { margin-top: 8px; font-size: 13px; }
  .ind-head details summary { cursor: pointer; opacity: .9; }
  .qitem { border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 10px; }
  .qitem:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  .qitem .qt { font-weight: 700; font-size: 14.5px; margin-bottom: 6px; }
  .calc { margin-top: 6px; font-size: 13.5px; font-weight: 700; color: var(--ok); background: #e9f7f1; padding: 6px 10px; border-radius: 8px; }
  .calc.empty { color: var(--muted); background: #f3f4f7; font-weight: 500; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
  .checks label { font-weight: 500; display: flex; gap: 6px; align-items: flex-start; font-size: 14px; cursor: pointer; }
  .checks input { width: 18px; min-height: 18px; margin-top: 3px; flex-shrink: 0; }
  .elem { border-top: 1px dashed var(--border); padding: 10px 0 2px; }
  .elem:first-of-type { border-top: 0; padding-top: 0; }
  .elem-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .elem-top b { flex: 1; min-width: 150px; }
  .elem-top select { width: auto; min-height: 34px; padding: 4px 8px; }
  .elem ul { margin: 2px 0 6px; padding-left: 18px; font-size: 13px; color: #4a5162; }
  .out-field textarea { min-height: 84px; font-size: 14px; }
  .ai-box { background: #f6f8ff; border: 1px solid #d5ddfa; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > input { flex: 1; min-width: 160px; }
  .group-title { font-weight: 800; margin: 12px 0 6px; color: var(--primary); }

  /* 미리보기 종이 */
  .paper {
    background: #fff; max-width: 820px; margin: 0 auto; padding: 44px 48px; box-shadow: 0 2px 14px rgba(20,30,60,.12);
    font-family: "Noto Serif KR", "Batang", "바탕", serif; font-size: 13px; color: #000; line-height: 1.6;
  }
  .paper p { margin: 0; }
  .paper .ps-center { text-align: center; }
  .paper .ps-right { text-align: right; }
  .paper .ps-h2 { margin-top: 16px; margin-bottom: 4px; }
  .paper .ps-h3 { margin: 10px 0 3px 4px; }
  .paper .ps-bullet { padding-left: 18px; text-indent: -12px; }
  .paper .ps-tblPara { margin: 6px 0; }
  .paper .cs-title { font-family: "Noto Sans KR", sans-serif; font-size: 23px; font-weight: 900; letter-spacing: 1px; }
  .paper .cs-slogan { font-family: "Noto Sans KR", sans-serif; font-size: 12px; color: #333; letter-spacing: 3px; }
  .paper .cs-school { font-family: "Noto Sans KR", sans-serif; font-size: 14px; font-weight: 700; }
  .paper .cs-h2 { font-family: "Noto Sans KR", sans-serif; font-weight: 800; font-size: 14px; }
  .paper .cs-h3 { font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 13px; }
  .paper .cs-bodyB { font-weight: 700; }
  .paper .cs-small { font-size: 11.5px; color: #444; }
  .paper .cs-gray { color: #a2a8b6; }
  .paper table { border-collapse: collapse; margin: 0; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 12px; line-height: 1.45; }
  .paper td { padding: 4px 7px; vertical-align: middle; }
  .paper td p { margin: 0; }
  .paper td.bf-grid, .paper td.bf-label, .paper td.bf-head, .paper td.bf-sub, .paper td.bf-score { border: 1px solid #000; }
  .paper td.bf-label { background: #dce3f4; font-weight: 700; text-align: center; }
  .paper td.bf-head { background: #c5d1f0; font-weight: 700; text-align: center; }
  .paper td.bf-sub { background: #f2f5fc; }
  .paper td.bf-score { background: #fff7d6; }
  .paper td.bf-chapNum { background: #1f33c9; color: #fff; font-weight: 800; font-size: 17px; text-align: center; }
  .paper td.bf-chapBar { background: linear-gradient(90deg, #6f87e2, #dfe6fb); font-weight: 800; font-size: 17px; text-align: center; letter-spacing: 4px; }
  .paper td.bf-pill { background: #2e3a87; color: #fff; font-weight: 700; text-align: center; border-radius: 999px; font-size: 13px; }
  .paper td.bf-titleBox { border-top: 5px solid #1f33c9; border-bottom: 5px solid #1f33c9; padding: 8px; }
  .paper td.al-center { text-align: center; }
  .paper td.cs-cellB { font-weight: 700; }
  .paper td.cs-h2 { font-weight: 800; font-size: 14px; }
  .paper td.bul p { padding-left: 12px; text-indent: -12px; }
  .paper .pb { border-top: 2px dashed #c9cfdd; margin: 30px -48px 26px; position: relative; }
  .paper .pb::after { content: "쪽 나눔"; position: absolute; right: 8px; top: -11px; background: #fff; color: #9aa3b5; font-size: 11px; padding: 0 6px; font-family: sans-serif; }
  .ind-sec { border-radius: 6px; cursor: pointer; }
  .paper .blk { position: relative; border-radius: 4px; outline: 2px dashed transparent; outline-offset: 3px; cursor: pointer; transition: outline-color .15s, background .15s; }
  .paper .blk:hover { outline-color: #8fa2ee; background: rgba(43,68,201,.03); }
  .paper .blk.on { outline: 3px solid #ff9f1a; background: rgba(255,176,32,.08); }
  .paper td.blk { outline: 0; }
  .paper td.blk:hover { box-shadow: inset 0 0 0 2px #8fa2ee; }
  .paper td.blk.on { outline: 0; box-shadow: inset 0 0 0 3px #ff9f1a; background: rgba(255,176,32,.08); }
  .paper .blk.on::before { content: "✔ 선택"; position: absolute; right: 0; top: -12px; background: #ff9f1a; color: #fff; font: 700 11px/1.6 sans-serif; padding: 0 8px; border-radius: 999px; z-index: 2; }
  .paper .blk.busy { opacity: .45; }
  .paper .blk.busy::after { content: "✍️ 고치는 중…"; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: #2b44c9; color: #fff; font: 700 12px/1.8 sans-serif; padding: 2px 12px; border-radius: 999px; z-index: 3; }
  .preview-wrap { padding-bottom: 230px; }
  .rev { position: fixed; right: 24px; bottom: 16px; width: min(620px, calc(54vw - 48px)); background: #fff; border: 2px solid #ff9f1a; border-radius: 14px; box-shadow: 0 10px 30px rgba(20,30,60,.22); padding: 12px 14px; z-index: 40; }
  .rev.empty { border-color: #d5ddfa; box-shadow: 0 4px 14px rgba(20,30,60,.12); }
  .rev.empty .rev-body, .rev.empty .rev-tools { display: none; }
  .rev-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
  .rev-head .hint { flex: 1; }
  .rev-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .rev-chips .chip { display: inline-flex; align-items: center; gap: 4px; background: #fff3dc; color: #8a4b00; border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 13px; font-weight: 700; }
  .rev-chips .chip button { min-height: 22px; width: 22px; padding: 0; background: transparent; color: #8a4b00; font-size: 15px; }
  .rev-quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .rev-quick button { min-height: 30px; padding: 0 10px; font-size: 12.5px; font-weight: 600; background: #f1f3f8; color: var(--text); }
  .rev-tools { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  /* 토스트 / 모달 */
  #toast {
    position: fixed; left: 50%; top: 96px; transform: translateX(-50%) translateY(-10px);
    background: #111827; color: #fff; padding: 10px 18px; border-radius: 999px; z-index: 50;
    opacity: 0; pointer-events: none; transition: .25s; font-size: 14px; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); padding: 16px; z-index: 60; }
  #modal.show { display: flex; }
  #modal .box { background: #fff; border-radius: var(--radius); padding: 22px; max-width: 380px; width: 100%; }
  #modal p { margin: 0 0 16px; white-space: pre-line; max-height: 55vh; overflow-y: auto; }
  .warn { background: #fff4e0; color: #8a4b00; border: 1px solid #f5d29a; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px; }

  .mobile-switch { display: none; }
  @media (max-width: 900px) {
    body { height: auto; min-height: 100%; }
    .layout { flex-direction: column; }
    .editor { width: 100%; min-width: 0; max-width: none; border-right: 0; }
    #form { overflow: visible; }
    .preview-wrap { padding: 8px; }
    .paper { padding: 22px 14px; font-size: 12px; }
    .paper .pb { margin-left: -14px; margin-right: -14px; }
    .paper table { font-size: 11px; }
    .mobile-switch { display: inline-flex; }
    body.show-preview .editor { display: none; }
    body:not(.show-preview) .rev { display: none; }
    .rev { left: 8px; right: 8px; width: auto; bottom: 8px; padding: 10px; }
    .rev-chips, .rev-quick { flex-wrap: nowrap; overflow-x: auto; }
    .rev-chips .chip, .rev-quick button { flex-shrink: 0; }
    .rev-head .hint { font-size: 12px; }
    body:not(.show-preview) .preview-wrap { display: none; }
    .grid2, .checks { grid-template-columns: 1fr; }
    .top h1 { font-size: 17px; }
  }
</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>📘 학교평가 보고서 메이커 <small>2026 경기 학교평가 지표</small></h1>
      <div class="madeby">
        <span>made by</span>
        <a class="mb-home" href="https://moonsunezipbrand.vercel.app" target="_blank" rel="noreferrer">문수네집</a>
        <a class="mb-insta" href="https://www.instagram.com/moonsune.zip/" target="_blank" rel="noreferrer">Instagram</a>
        <a class="mb-site" href="https://moonsune-zip.vercel.app/" target="_blank" rel="noreferrer">컨텐츠사이트</a>
      </div>
    </div>
    <div class="actions">
      <button class="mobile-switch" data-act="switch">📄 미리보기</button>
      <button data-act="ai-all">✨ 빈 지표 AI로 모두 쓰기</button>
      <button class="main" data-act="hwpx">⬇ 한글(.hwpx) 저장</button>
      <div class="menu">
        <button data-act="menu" aria-label="더보기">⋯ 더보기</button>
        <div class="menu-list" id="menu">
          <button data-act="copy">📋 보고서 글 전체 복사</button>
          <button data-act="sample">🧪 예시 내용 불러오기</button>
          <button data-act="backup">💾 작업 백업 파일 저장</button>
          <button data-act="restore">📂 백업 파일 불러오기</button>
          <button data-act="reset">🗑 처음부터 다시</button>
        </div>
      </div>
    </div>
  </header>
  <div id="progress"><div class="bar"></div></div>
  <div id="status"></div>
  <div class="layout">
    <aside class="editor">
      <nav id="tabs"></nav>
      <section id="form"></section>
    </aside>
    <main class="preview-wrap"><div id="preview" class="paper"></div></main>
  </div>
  <div id="rev" class="rev empty">
    <div class="rev-head"><b>✏️ 블록 골라 고치기</b><span class="hint" id="rev-hint">미리보기에서 고칠 부분(블록)을 눌러 선택하세요. 여러 개 고를 수 있어요.</span>
      <button class="ghost small" data-act="rev-clear" id="rev-clear" style="display:none">선택 해제</button></div>
    <div class="rev-body">
      <div class="rev-chips" id="rev-chips"></div>
      <div class="rev-quick">
        <button data-act="rev-quick" data-q="더 구체적으로">더 구체적으로</button>
        <button data-act="rev-quick" data-q="더 짧고 간결하게">더 짧게</button>
        <button data-act="rev-quick" data-q="○○ 빈칸을 줄이고 자연스러운 문장으로">○○ 줄이기</button>
        <button data-act="rev-quick" data-q="메모 내용을 더 많이 반영해서">메모 반영</button>
        <button data-act="rev-quick" data-q="우수사례가 돋보이게">우수사례 강조</button>
        <button data-act="rev-quick" data-q="항목을 하나 더 추가해서">항목 추가</button>
      </div>
      <div class="row"><input id="rev-input" placeholder="어떻게 고칠까요? 예) 운영 내용에 학생 자치회 캠페인을 넣어 줘"><button data-act="rev-go" id="rev-go">✨ 선택 블록 고쳐 쓰기</button></div>
    </div>
    <div class="rev-tools"><button class="ghost small" data-act="rev-undo" id="rev-undo" style="display:none">↩ 방금 고친 것 되돌리기</button></div>
  </div>
  <input type="file" id="file-restore" accept=".json,application/json" hidden>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal" role="dialog" aria-modal="true">
    <div class="box">
      <p id="modal-msg"></p>
      <div class="row" style="justify-content:flex-end">
        <button class="ghost" id="modal-no">취소</button>
        <button class="soft" id="modal-alt" style="display:none"></button>
        <button id="modal-yes">확인</button>
      </div>
    </div>
  </div>

<script>
// ============================================================
//  학교평가 보고서 메이커 (Gemini Canvas용 단일 HTML)
//  - 근거: 2026 경기 학교평가 안내서(일반학교 초등 지표), 보고서 틀(예시)
//  - Canvas 안에서는 apiKey를 비워 두면 Gemini가 자동으로 연결된다
// ============================================================
const apiKey = "";
const MODEL = "gemini-2.5-flash-preview-09-2025";
const STORE_KEY = "school-eval-report-maker-v1";

// ---------- 안전한 저장소 ----------
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }
};

// ============================================================
//  1. 평가 지표 정의 (2026 경기 학교평가 안내서 · 초등)
// ============================================================
const G5 = ["매우 우수", "우수", "보통", "미흡", "매우 미흡"];
const scale = (max, r = [1, .8, .6, .4, .2]) => r.map(x => Math.round(max * x * 10) / 10);

const AREAS = [

function fieldsOf(def) {
  const f = [];
  if (def.quant) {
    f.push({ key: "qres", label: "정량 결과분석(우수사례, 개선사항)", n: "2~4", sect: "quant" });

  }
  if (def.qual) {
    if (def.qual.diag) f.push({ key: "diag", label: "현안 진단", n: "3~4", sect: "qual" });
    f.push({ key: "plan", label: "계획 수립", n: "3~4", sect: "qual" });
    f.push({ key: "op", label: "운영 내용", n: "4~5", sect: "qual" });
    f.push({ key: "res", label: "운영결과", n: "2~3", sect: "qual" });
    f.push({ key: "cases", label: "우수사례 및 개선 사항", n: "3~4", sect: "qual", hint: "앞에 (우수) 또는 (개선)을 붙여 구분" });
    f.push({ key: "next", label: "다음 학년도 반영 사항", n: "2~3", sect: "qual" });
  }
  if (def.groups) {
    for (const g of def.groups) {
      f.push({ key: g.key + "_m", label: `${g.name} · 의견 수렴 방법과 내용`, n: "2~3", sect: g.key });
      f.push({ key: g.key + "_a", label: `${g.name} · 분석 및 성찰(강점·개선점)`, n: "3~4", sect: g.key });
      f.push({ key: g.key + "_n", label: `${g.name} · 차년도 계획 반영`, n: "2~3", sect: g.key });
    }
    f.push({ key: "next", label: "다음 학년도 반영사항(종합)", n: "2~3", sect: "total" });
  }
  f.push({ key: "future", label: "향후 추진 계획(Ⅳ장 표에 들어감)", n: "1~2", sect: "future" });
  return f;
}

function blocksOf(def) {
  const b = [];
  if (def.quant) b.push({ key: "quant", label: "정량 결과분석", fields: ["qres", "qnext"] });
  if (def.qual) {
    if (def.qual.diag) b.push({ key: "diag", label: "현안 진단", fields: ["diag"] });
    b.push({ key: "plan", label: "계획 수립", fields: ["plan"] });
    b.push({ key: "op", label: "운영 내용", fields: ["op"] });
    b.push({ key: "res", label: def.qual.thirdLabel || "성과 분석 및 환류", fields: ["res", "cases", "next"] });
  }
  if (def.groups) {
    def.groups.forEach(g => b.push({ key: g.key, label: `${g.name} 의견 수렴`, fields: [g.key + "_m", g.key + "_a", g.key + "_n"] }));
    b.push({ key: "total", label: "다음 학년도 반영사항(종합)", fields: ["next"] });
  }
  b.push({ key: "future", label: "향후 추진 계획", fields: ["future"] });
  return b;
}

const num = (v) => { if (v === undefined || v === null || String(v).trim() === "") return null; const n = Number(String(v).replace(/[,\s]/g, "")); return isFinite(n) ? n : null; };
const r2 = (x) => Math.round(x * 100) / 100;
const fmt = (x) => (Math.round(x * 100) / 100).toString();
const band = (bands, v) => bands.find(b => v >= b[0]);

function evalQuant(item, q) {
  const k = item.key;
  if (item.type === "select") {
    const i = q[k];
    if (i === undefined || i === "") return { done: false };
    const o = item.options[Number(i)];
    return { done: true, value: o[0], grade: item.grades ? item.grades[Number(i)] : o[0], score: o[1] };
  }
  if (item.type === "rate") {
    const a = num(q[k + "_a"]), b = num(q[k + "_b"]);
    if (a === null || b === null || a <= 0) return { done: false };
    const pct = r2(b / a * 100);
    const bd = band(item.bands, pct), gi = item.bands.indexOf(bd);
    return { done: true, value: `${pct}%`, grade: G5[gi] || bd[1], range: bd[1], score: bd[2], detail: `A ${q[k + "_a"]} / B ${q[k + "_b"]}` };
  }
  const touched = () => Object.keys(q).some(x => x.startsWith(k + "_"));
  if ((item.type === "checks" || item.type === "count") && !touched()) return { done: false };
  if (item.type === "checks") {
    const on = item.items.filter((_, i) => q[`${k}_${i}`]);
    const score = r2(on.reduce((s, x) => s + x[1], 0));
    const off = item.items.filter((_, i) => !q[`${k}_${i}`]).map(x => x[0]);
    return { done: true, value: on.length ? on.map(x => x[0]).join(", ") : "해당 없음", grade: `${on.length}/${item.items.length}개 충족`, score, on: on.map(x => x[0]), off };
  }
  if (item.type === "count") {
    const n = item.items.filter((_, i) => q[`${k}_${i}`]).length;
    const bd = band(item.bands, n), gi = item.bands.indexOf(bd);
    return { done: true, value: `${n}개 항목 시행`, grade: G5[gi], range: bd[1], score: bd[2],
      on: item.items.filter((_, i) => q[`${k}_${i}`]), off: item.items.filter((_, i) => !q[`${k}_${i}`]) };
  }
  if (item.type === "facility") {
    const g = num(q[k + "_g"]), y = num(q[k + "_y"]);
    if (g === null && y === null) return { done: false };
    const days = r2(Math.min(g || 0, 120) * .5 + (y || 0) * .5);
    const bd = band(item.bands, days), gi = item.bands.indexOf(bd);
    return { done: true, value: `${days}일`, grade: G5[gi], range: bd[1], score: bd[2], detail: `운동장 ${g ?? 0}일, 체육관 ${y ?? 0}일` };
  }
  return { done: false };
}

function qualElems(def) {
  if (def.qual) return def.qual.elements.map((e, i) => ({ ...e, gk: String(i) }));
  if (def.groups) return def.groups.flatMap(g => def.groupElements.map((e, i) => ({ ...e, gk: `${g.key}${i}`, group: g.name })));
  return [];
}
function evalElem(e, st) {
  const v = st.g[e.gk];
  if (v === undefined || v === "") return { done: false };
  return { done: true, grade: G5[Number(v)], score: e.scores[Number(v)] };
}
function indScore(def) {
  const st = S(def.id);
  let score = 0, total = 0, done = 0;
  for (const it of def.quant?.items || []) { total++; const r = evalQuant(it, st.q); if (r.done) { done++; score += r.score; } }
  for (const e of qualElems(def)) { total++; const r = evalElem(e, st); if (r.done) { done++; score += r.score; } }
  return { score: r2(score), done, total, complete: done === total };
}
// 질문 틀 제목(■ …:)만 있는 메모는 빈 메모로 본다
const memoText = (m) => String(m || "").replace(/■[^:\n]*:/g, "").trim();
// 지표에서 아직 안 채운 것
function indMissing(def) {
  const st = S(def.id), m = [];
  const q = (def.quant?.items || []).filter(it => !evalQuant(it, st.q).done).map(it => it.label);
  if (q.length) m.push(`정량 실적(${q.join(", ")})`);
  const g = qualElems(def).filter(e => !evalElem(e, st).done).length;
  if (g) m.push(`자체 판단 등급 ${g}개`);
  if (!memoText(st.memo)) m.push("올해 한 일 메모");
  const empty = fieldsOf(def).filter(f => !(st.out[f.key] || "").trim()).length;
  if (empty) m.push(`보고서 글 ${empty}칸`);
  const holes = fieldsOf(def).reduce((n, f) => n + ((st.out[f.key] || "").match(/○+/g) || []).length, 0);
  if (holes) m.push(`글 속 ○ 빈칸 ${holes}곳`);
  return m;
}
function allMissing() {
  const s = state.school, out = [];
  const sm = [["name", "학교명"], ["principal", "학교장"], ["vice", "교감"], ["address", "주소"], ["classes", "학급수"], ["students", "총 학생수"], ["vision", "비전·교육 목표"]].filter(([k]) => !String(s[k] || "").trim()).map(x => x[1]);
  if (sm.length) out.push(`학교 현황: ${sm.join(", ")}`);
  for (const d of INDICATORS) { const m = indMissing(d); if (m.length) out.push(`${d.id}: ${m.join(", ")}`); }
  return out;
}
function indStatus(def) {
  const st = S(def.id);
  const fields = fieldsOf(def);
  const filled = fields.filter(f => (st.out[f.key] || "").trim()).length;
  if (filled >= fields.length && indScore(def).complete) return "done";
  if (filled > 0 || st.memo.trim() || indScore(def).done) return "half";
  return "";
}

const cleanLine = (x) => String(x).replace(/^\s*(?:[∙•·\-*]|\d+[.)])\s*/, "").trim().replace(/\s*[.。]+$/, "");
const lines = (s) => String(s || "").split("\n").flatMap(x => x.split(/(?<=[가-힣])\.\s+(?=\S)/)).map(cleanLine).filter(Boolean);
const P = (text, cs = "body", ps = "body", extra = {}) => ({ t: "p", ps, runs: [{ text, cs }], ...extra });
const cell = (c, o = {}) => ({ c, ...o });
const L = (c, o = {}) => cell(c, { bf: "label", align: "center", cs: "cellB", ...o });
const H = (c, o = {}) => cell(c, { bf: "head", align: "center", cs: "cellB", ...o });

function bulletCell(text, o = {}) {
  const ls = lines(text);
  return cell(ls.length ? ls : ["", ""], { bullet: true, ...o });
}
function chapter(num, title) {
  return { t: "tbl", ps: "chapPara", widths: [2600, 900, 17000], abs: true, bf: "none",
    rows: [[cell(num, { bf: "chapNum", align: "center", cs: "chapNum", h: 2300 }), cell("", { bf: "none" }), cell(title, { bf: "chapBar", align: "center", cs: "chapTitle" })]] };
}
function pill(text, rest) {
  const rows = [[cell(text, { bf: "pill", align: "center", cs: "pill", h: 1900 })]];
  const widths = [Math.max(9000, text.length * 1250 + 2400)];
  if (rest) { rows[0].push(cell("", { bf: "none" }), cell(rest, { bf: "none", cs: "h2" })); widths.push(600, 30000); }
  return { t: "tbl", ps: "pillPara", widths, abs: true, bf: "none", rows };
}

      [cell(q.b_plan || "", { align: "center" }), cell(q.b_used || "", { align: "center" }), cell(rate(q.b_plan, q.b_used), { align: "center", bf: "score" })],
    ] });
    push(P("※ 학교자율과제 예산 집행은 편성 예산 대비 95% 이상 권장(회계 마감일 기준 집행 예정액 포함)", "small", "bullet"));
  }
  if (d.groups) {
    d.groups.forEach((g, gi) => {
      push(P(`${ab[gi]}. ${g.name} 의견 수렴 및 환류 노력`, "h3", "h3"), g.key);
      let sum = 0, all = true;
      const scoreRows = d.groupElements.map((e, i) => {
        const r = evalElem({ ...e, gk: `${g.key}${i}` }, st);
        if (r.done) sum += r.score; else all = false;
        return [L(`${e.name}(${fmt(e.max)}점)`, { bf: "sub" }), cell(r.done ? r.grade : "", { align: "center" }), cell(r.done ? fmt(r.score) : "", { align: "center", bf: "score" })];
      });
      push({ t: "tbl", ps: "tblPara", widths: [52, 28, 20], rows: [
        [H("평가요소"), H("평가결과"), H("점수")], ...scoreRows,
        [L("총계", { span: 2 }), cell(all || sum ? `${fmt(sum)} / 5` : "", { align: "center", bf: "score", cs: "cellB" })]] }, g.key);
      push({ t: "tbl", ps: "tblPara", widths: [20, 80], rows: [
        [L("의견 수렴\n방법과 내용"), bulletCell(out[g.key + "_m"])],
        [L("분석 및 성찰\n(강점·개선점)"), bulletCell(out[g.key + "_a"])],
        [L("차년도 계획\n반영"), bulletCell(out[g.key + "_n"])],
      ] }, g.key);
    });
    push({ t: "tbl", ps: "tblPara", widths: [20, 80], rows: [[L("다음 학년도\n반영사항"), bulletCell(out.next)]] }, "total");
  }
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cellLines = (c) => Array.isArray(c.c) ? c.c : String(c.c ?? "").split("\n");

function tableHtml(b) {
  const total = b.widths.reduce((s, x) => s + x, 0);
  const width = b.abs ? `${Math.min(100, total / BODY_W * 100)}%` : "100%";
  let h = `<table style="width:${width}"><colgroup>${b.widths.map(x => `<col style="width:${x / total * 100}%">`).join("")}</colgroup>`;
  for (const row of b.rows) {
    h += "<tr>";
    for (const c of row) {
      const ls = cellLines(c);
      const body = ls.map(x => {
        const text = c.bullet ? `∙ ${x}` : x;
        return `<p>${esc(text) || "&nbsp;"}</p>`;
      }).join("");
      const cls = [`bf-${c.bf || "grid"}`, c.align === "center" ? "al-center" : "", c.bullet ? "bul" : "", c.cs ? `cs-${c.cs}` : "", c.blk ? `blk${blkCls(c.blk)}` : ""].join(" ");
      h += `<td class="${cls}"${spanAttr(c)}${c.blk ? ` data-blk="${c.blk}" title="눌러서 이 블록 선택"` : ""}>${body}</td>`;
    }
    h += "</tr>";
  }
  return h + "</table>";
}
function spanAttr(c) {
  let a = "";
  if (c.span > 1) a += ` colspan="${c.span}"`;
  if (c.rs > 1) a += ` rowspan="${c.rs}"`;
  return a;
}

const sel = new Set(), revBusy = new Set();
let lastRev = [];
const blkCls = (k) => (sel.has(k) ? " on" : "") + (revBusy.has(k) ? " busy" : "");

function renderPreview() {
  const blocks = buildDoc();
  let html = "", curInd = null, curBlk = null;
  const open = (id) => { html += `<div class="ind-sec" data-ind="${id}">`; };
  const closeBlk = () => { if (curBlk) { html += "</div>"; curBlk = null; } };
  for (const b of blocks) {
    const ind = b.ind || null;
    if (ind !== curInd) { closeBlk(); if (curInd) html += "</div>"; if (ind) open(ind); curInd = ind; }
    const blk = b.blk ? `${ind}:${b.blk}` : null;
    if (blk !== curBlk) { closeBlk(); if (blk) { html += `<div class="blk${blkCls(blk)}" data-blk="${blk}" title="눌러서 이 블록 선택">`; curBlk = blk; } }
    if (b.t === "pb") { html += `<div class="pb"></div>`; continue; }
    if (b.t === "p") { html += `<p class="ps-${b.ps}">${b.runs.map(r => `<span class="cs-${r.cs}">${esc(r.text)}</span>`).join("")}</p>`; continue; }
    if (b.t === "tbl") html += `<div class="ps-${b.ps}">${tableHtml(b)}</div>`;
  }
  closeBlk();
  if (curInd) html += "</div>";
  $("#preview").innerHTML = html;
}
function schedulePreview() { clearTimeout(previewTimer); previewTimer = setTimeout(renderPreview, 250); }

const cellStyle = (cl) => cl.cs || (cl.bf === "label" || cl.bf === "head" ? "cellB" : "cell");
// 칸 높이 어림(한글이 열 때 내용에 맞게 다시 늘린다)
function textUnits(s, h) { let u = 0; for (const ch of s) u += ch.charCodeAt(0) < 0x2000 ? .55 : 1; return u * h; }
function estLines(text, width, h) { return Math.max(1, Math.ceil(textUnits(text, h) / Math.max(1000, width))); }

function buildSection() {
  let id = 1000;
  const nid = () => ++id;
  const out = [];
  let first = true, pendingBreak = false;
  const firstRun = () => {
    if (!first) return "";
    first = false;
    return `<hp:run charPrIDRef="0">${secPrXml()}<hp:ctrl><hp:colPr id="" type="NEWSPAPER" layout="LEFT" colCount="1" sameSz="1" sameGap="0"/></hp:ctrl></hp:run>`;
  };
  const pOpen = (ps) => { const pb = pendingBreak ? 1 : 0; pendingBreak = false; return `<hp:p id="${nid()}" paraPrIDRef="${PS[ps]}" styleIDRef="0" pageBreak="${pb}" columnBreak="0" merged="0">`; };
  const run = (text, cs) => `<hp:run charPrIDRef="${CS[cs]}">${text ? `<hp:t>${xesc(text)}</hp:t>` : "<hp:t/>"}</hp:run>`;

  function tableXml(b) {
    const totalW = b.abs ? b.widths.reduce((s, x) => s + x, 0) : BODY_W;
    const sum = b.widths.reduce((s, x) => s + x, 0);
    const W = b.widths.map(x => Math.floor(x / sum * totalW));
    W[W.length - 1] += totalW - W.reduce((s, x) => s + x, 0);
    const nCols = W.length, nRows = b.rows.length;
    // 칸 배치(병합 고려)
    const occ = Array.from({ length: nRows }, () => Array(nCols).fill(false));
    const placed = [];
    b.rows.forEach((row, r) => {
      let c = 0;
      for (const cl of row) {
        while (c < nCols && occ[r][c]) c++;
        const cs = cl.span || 1, rs = cl.rs || 1;
        for (let rr = r; rr < Math.min(nRows, r + rs); rr++) for (let cc = c; cc < Math.min(nCols, c + cs); cc++) occ[rr][cc] = true;
        placed.push({ cl, r, c, cs, rs, w: W.slice(c, c + cs).reduce((s, x) => s + x, 0) });
        c += cs;
      }
    });
    // 행 높이
    const rowH = Array(nRows).fill(1500);
    const need = (p) => {
      const font = CHAR_H[cellStyle(p.cl)];
      const ls = cellLines(p.cl);
      const n = ls.reduce((s, x) => s + estLines((p.cl.bullet ? "∙ " : "") + x, p.w - 1100, font), 0);
      return Math.max(p.cl.h || 0, Math.round(n * font * 1.45 + 560));
    };
    placed.filter(p => p.rs === 1).forEach(p => { rowH[p.r] = Math.max(rowH[p.r], need(p)); });
    placed.filter(p => p.rs > 1).forEach(p => {
      const have = rowH.slice(p.r, p.r + p.rs).reduce((s, x) => s + x, 0), want = need(p);
      if (want > have) rowH[p.r + p.rs - 1] += want - have;
    });
    const cellXml = (p) => {
      const cl = p.cl, ls = cellLines(cl);
      const cs = cellStyle(cl);
      const ps = cl.align === "center" ? "cellC" : (cl.bullet ? "cellBullet" : "cell");
      const paras = ls.map(x => `${pOpenPlain(ps)}${run(cl.bullet ? `∙ ${x}` : x, cs)}</hp:p>`).join("");
      const h = rowH.slice(p.r, p.r + p.rs).reduce((s, x) => s + x, 0);
      return `<hp:tc name="" header="0" hasMargin="0" protect="0" editable="0" dirty="1" borderFillIDRef="${BF[cl.bf || "grid"]}">` +
        `<hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="CENTER" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${paras}</hp:subList>` +
        `<hp:cellAddr colAddr="${p.c}" rowAddr="${p.r}"/><hp:cellSpan colSpan="${p.cs}" rowSpan="${p.rs}"/><hp:cellSz width="${p.w}" height="${h}"/>` +
        `<hp:cellMargin left="510" right="510" top="141" bottom="141"/></hp:tc>`;
    };
    let rowsXml = "";
    for (let r = 0; r < nRows; r++) rowsXml += `<hp:tr>${placed.filter(p => p.r === r).map(cellXml).join("")}</hp:tr>`;
    const totalH = rowH.reduce((s, x) => s + x, 0);
    return `<hp:tbl id="${nid()}" zOrder="0" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="0" rowCnt="${nRows}" colCnt="${nCols}" cellSpacing="0" borderFillIDRef="${BF[b.bf === "none" ? "none" : "grid"]}" noAdjust="0">` +
      `<hp:sz width="${totalW}" widthRelTo="ABSOLUTE" height="${totalH}" heightRelTo="ABSOLUTE" protect="0"/>` +
      `<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>` +
      `<hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:inMargin left="510" right="510" top="141" bottom="141"/>${rowsXml}</hp:tbl>`;
  }
  const pOpenPlain = (ps) => `<hp:p id="${nid()}" paraPrIDRef="${PS[ps]}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0">`;

  for (const b of buildDoc()) {
    if (b.t === "pb") { pendingBreak = true; continue; }
    if (b.t === "p") { out.push(pOpen(b.ps) + firstRun() + b.runs.map(r => run(r.text.trim() ? r.text : "", r.cs)).join("") + "</hp:p>"); continue; }
    if (b.t === "tbl") out.push(pOpen(b.ps) + firstRun() + `<hp:run charPrIDRef="0">${tableXml(b)}<hp:t/></hp:run></hp:p>`);
  }
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes" ?><hs:sec ${NS}>${out.join("")}</hs:sec>`;
}

function docPlainText() {
  const parts = [];
  for (const b of buildDoc()) {
    if (b.t === "p") parts.push(b.runs.map(r => r.text).join(""));
    if (b.t === "tbl") for (const row of b.rows) parts.push(row.map(c => cellLines(c).map(x => (c.bullet && x ? "∙ " + x : x)).join(" ")).filter(x => x.trim()).join(" | "));
    if (b.t === "pb") parts.push("");
  }
  return parts.join("\n").replace(/\n{3,}/g, "\n\n");
}

const SYSTEM_PROMPT = `당신은 경기도 초등학교의 학교평가 업무 담당 교사를 돕는 보고서 작성 도우미입니다.
담당 교사가 준 메모와 지표 정보를 바탕으로 「학교평가 보고서」의 '평가 결과' 부분 문장을 씁니다.
[문체] 공문서 개조식. 한 항목은 한 문장(40~90자). 끝맺음을 통일함: 한 일·결과는 '~함'(예: 운영함, 실시함, 높임), 앞으로의 계획은 '~할 예정임'. '~하였음', '~합니다', '~했다'는 쓰지 않음. 한 항목 안에 문장을 두 개 넣지 않음.
[기호] 항목 앞에 •, ∙, -, 숫자 같은 기호를 붙이지 않음(보고서가 자동으로 붙임).
[사실] 메모와 정량 결과에 있는 사실·수치만 근거로 씀. 메모에 없는 수치, 날짜, 행사·프로그램 이름, 사업명·제도명·조직·위원회 이름(예: 두드림학교, 다중지원팀, 멘토링, 안심번호, 협약·규약), 설문 결과를 절대 지어내지 않음. 꼭 필요한 자리는 '○○', '○회', '○%'처럼 빈칸으로 남겨 담당자가 채우게 함.
[빈칸] ○○는 숫자·이름이 들어갈 자리에만 쓰고 한 항목에 1개까지만 씀. '○○함', '○○하는', '○○한 실적'처럼 동사·서술어 자리에는 절대 쓰지 않음. 모르는 내용은 빈칸 대신 특정 이름 없는 자연스러운 문장으로 씀.
[정량] 정량 결과에서 '미시행'으로 표시된 항목은 시행했다고 쓰지 않음. '수치 미입력'은 담당자가 앱에 아직 숫자를 안 넣었다는 뜻일 뿐 학교의 문제가 아니므로, 수치만 ○○로 비우고 '실적 관리·입력·증빙'을 개선점이나 반영사항으로 쓰지 않음. 정량표의 결과와 문장이 서로 어긋나면 안 됨.
[우수·개선] 우수사례 및 개선 사항은 (우수) 항목을 먼저, (개선) 항목을 뒤에 씀.
[표현] '강화', '체계', '내실', '도모', '제고', '지속적' 같은 상투어를 되풀이하지 말고, 누가·무엇을·어떻게 했는지 드러나는 구체적인 동사로 씀. 문장 끝에 마침표를 찍지 않음.
[흐름] 평가 주안점에 답하듯 계획 → 운영 → 성과분석·환류가 이어지게 쓰고, 개선점은 다음 학년도 반영사항과 연결함.
[출력] 요청한 키만 가진 JSON 객체 하나만 출력. 값은 모두 문자열 배열(한 원소 = 한 항목).`;

async function callGemini(prompt) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`;
  const payload = {
    contents: [{ role: "user", parts: [{ text: prompt }] }],
    systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
    // 2.5 모델은 '생각'에도 출력 한도를 써서 긴 답이 잘릴 수 있으므로 생각을 끄고 한도를 넉넉히 둔다
    generationConfig: { responseMimeType: "application/json", maxOutputTokens: 16384, temperature: 0.6, thinkingConfig: { thinkingBudget: 0 } },
  };
  // 사용자가 몰릴 때(429), 서버 오류(5xx), 연결 끊김은 잠깐 기다렸다 다시 시도
  for (let attempt = 0; ; attempt++) {
    let res;
    try {
      res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    } catch (e) {
      if (attempt >= 4) throw new Error("인터넷 연결을 확인해 주세요.");
      await sleep(1000 * 2 ** attempt); continue;
    }
    if (res.ok) {
      const data = await res.json();
      const text = data.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("");
      if (text) return text;
      if (attempt < 2) { await sleep(1500); continue; }
      throw new Error("AI 응답이 비어 있어요. 다시 시도해 주세요.");
    }
    // 이 모델이 생각 설정을 모르면 빼고 다시 보낸다
    if (res.status === 400 && payload.generationConfig.thinkingConfig) { delete payload.generationConfig.thinkingConfig; continue; }
    if (!(res.status === 429 || res.status >= 500) || attempt >= 5) throw new Error(`AI 호출 실패(${res.status}). 잠시 후 다시 시도해 주세요.`);
    await sleep(1500 * 2 ** attempt + Math.random() * 800);
  }
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function parseJson(text) {
  const t = String(text).replace(/```(?:json)?/g, "").trim();
  try { return JSON.parse(t); } catch (e) {}
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  throw new Error("AI 답을 읽지 못했어요. 다시 눌러 주세요.");
}

function indicatorContext(d) {
  const st = S(d.id), s = state.school;
  const L2 = [];
  const yr = Number(s.year) || 2026;
  L2.push(`[학교] ${s.name || "○○초등학교"} (${yr}학년도)${s.classes ? `, 학급 ${s.classes}` : ""}${s.students ? `, 학생 ${s.students}명` : ""}`);
  L2.push(`[학년도] 올해는 ${yr}학년도, 전년도는 ${yr - 1}학년도, 다음 학년도는 ${yr + 1}학년도임. 학년도를 ○○로 비우지 말 것`);
  if (s.vision) L2.push(`[학교 비전·교육 목표] ${s.vision.replace(/\n/g, " / ")}`);
  L2.push(`[평가 지표] ${d.id}. ${d.title} (${d.pts}점, ${d.method})`);
  L2.push(`[평가 목적] ${d.purpose.join(" / ")}`);
  if (d.quant) {
    L2.push("[정량평가 결과]");
    d.quant.items.forEach(it => {
      const r = evalQuant(it, st.q);
      if (!r.done) { L2.push(`- ${it.label}(${it.max}점): 수치 미입력(담당자가 아직 안 넣음) — 수치는 ○○로 비우고 시행 여부를 단정하지 말 것`); return; }
      L2.push(`- ${it.label}(${it.max}점): ${r.value}${r.detail ? ` (${r.detail})` : ""} → ${r.grade}${r.range ? `(${r.range})` : ""}, ${fmt(r.score)}점`);
      if (r.on) L2.push(`  · 시행: ${r.on.join(", ") || "없음"} / 미시행(시행했다고 쓰지 말 것): ${r.off.join(", ") || "없음"}`);
    });
  }
  if (d.qual) {
    L2.push(`[정성평가: ${d.qual.title} — 평가 주안점과 담당자 자체 판단]`);
    d.qual.elements.forEach((e, i) => {
      const r = evalElem({ ...e, gk: String(i) }, st);
      L2.push(`- ${e.name}(${e.max}점)${r.done ? ` [자체 판단: ${r.grade}]` : ""}: ${e.points.join(" / ")}`);
    });
  }
  if (d.groups) {
    L2.push("[정성평가: 학생·교직원·학부모 의견 수렴 및 환류 — 평가 주안점]");
    d.groups.forEach(g => L2.push(`- ${g.name}: ${g.points.join(" / ")}`));
  }
  if (d.budget) {
    const q = st.q;
    L2.push(`[학교자율과제 예산] 표준교육비 총액 ${q.b_std || "?"}천원, 편성 ${q.b_plan || "?"}천원, 집행 ${q.b_used || "?"}천원`);
  }
  if (d.aiNote) L2.push(`[주의] ${d.aiNote}`);
  L2.push("[담당 교사 메모]");
  L2.push(memoText(st.memo) ? st.memo.trim() : "(메모 없음 — 학교가 실제로 한 활동을 알 수 없음. 특정 사업·제도·조직 이름을 쓰지 말고 '○○ 프로그램'처럼 비워 두며, 평가 주안점에 맞춘 틀 문장으로만 쓸 것. 수치·날짜·결과도 모두 ○○로 비울 것)");
  return L2.join("\n");
}

function keySpec(d, only) {
  return fieldsOf(d).filter(f => !only || only.includes(f.key)).map(f => `"${f.key}": 문자열 배열(${f.n}개) — ${f.label}${f.hint ? ` (${f.hint})` : ""}`).join("\n");
}

function applyResult(d, obj, only) {
  const st = S(d.id);
  st.prev = { ...st.out };
  for (const f of fieldsOf(d)) {
    if (only && !only.includes(f.key)) continue;
    const v = obj[f.key];
    if (v === undefined || v === null) continue;
    let arr = lines((Array.isArray(v) ? v : [v]).map(String).join("\n"));
    if (f.key === "cases") arr = [...arr.filter(x => !x.startsWith("(개선)")), ...arr.filter(x => x.startsWith("(개선)"))];
    st.out[f.key] = arr.join("\n");
  }
}

// AI 답을 받아 JSON으로 읽기(잘려서 못 읽으면 한 번 더 요청)
async function askJson(prompt) {
  try { return parseJson(await callGemini(prompt)); }
  catch (e) { if (!/읽지 못했/.test(e.message)) throw e; return parseJson(await callGemini(prompt)); }
}

// 고른 블록만 다시 쓰기
async function aiWriteBlocks(id, bks, instruction) {
  const d = IND[id], st = S(id);
  const picked = blocksOf(d).filter(b => bks.includes(b.key));
  const only = picked.flatMap(b => b.fields);
  const empty = only.every(k => !(st.out[k] || "").trim());
  const cur = Object.fromEntries(fieldsOf(d).map(f => [f.key, lines(st.out[f.key])]));
  const req = instruction || (empty ? "아직 비어 있으니 새로 써 주세요" : "문장을 더 자연스럽고 구체적으로 다듬어 주세요");
  const prompt = indicatorContext(d) + `\n\n[이 지표에 이미 쓴 글 전체 — 앞뒤 흐름을 맞추는 참고용]\n${JSON.stringify(cur, null, 1)}\n\n` +
    `[고칠 부분] ${picked.map(b => b.label).join(", ")}\n[수정 요청] ${req}\n\n` +
    `고칠 부분만 수정 요청대로 다시 쓰세요. 다른 부분과 내용이 겹치지 않게 하세요. 아래 키만 가진 JSON으로 출력하세요.\n${keySpec(d, only)}`;
  applyResult(d, await askJson(prompt), only);
}

async function aiWrite(id, instruction) {
  const d = IND[id], st = S(id);
  let prompt = indicatorContext(d) + "\n\n";
  if (instruction) {
    const cur = Object.fromEntries(fieldsOf(d).map(f => [f.key, lines(st.out[f.key])]));
    prompt += `[현재 내용]\n${JSON.stringify(cur, null, 1)}\n\n[수정 요청] ${instruction}\n\n수정 요청대로 고쳐 쓰고, 요청하지 않은 부분은 최대한 그대로 두세요. 아래 키를 모두 가진 JSON으로 출력하세요.\n${keySpec(d)}`;
  } else {
    prompt += `위 내용으로 이 지표의 보고서 문장을 쓰세요. 아래 키를 모두 가진 JSON으로 출력하세요.\n${keySpec(d)}`;
  }
  applyResult(d, await askJson(prompt));
}

}

function renderQuantItem(d, it) {
  const st = S(d.id), q = st.q, k = it.key, b = (x) => `q:${d.id}:${x}`;
  let body = "";
  if (it.type === "select") {
    body = `<select data-bind="${b(k)}"><option value="">선택하세요</option>${it.options.map((o, i) => `<option value="${i}" ${String(q[k]) === String(i) ? "selected" : ""}>${esc(o[0])} (${fmt(o[1])}점)</option>`).join("")}</select>`;
  } else if (it.type === "rate") {
    body = `<div class="grid2"><div class="field"><label class="hint">${esc(it.a)}</label>${inp(b(k + "_a"), q[k + "_a"] ?? "", "숫자", "text")}</div><div class="field"><label class="hint">${esc(it.b)}</label>${inp(b(k + "_b"), q[k + "_b"] ?? "", "숫자", "text")}</div></div>`;
  } else if (it.type === "checks" || it.type === "count") {
    const items = it.type === "checks" ? it.items.map(x => `${x[0]} (${fmt(x[1])}점)`) : it.items;
    body = `<div class="checks">${items.map((x, i) => `<label><input type="checkbox" data-bind="${b(`${k}_${i}`)}" ${q[`${k}_${i}`] ? "checked" : ""}>${esc(x)}</label>`).join("")}</div>`;
  } else if (it.type === "facility") {
    body = `<div class="grid2"><div class="field"><label class="hint">운동장 개방 가능 일수</label>${inp(b(k + "_g"), q[k + "_g"] ?? "", "예) 120")}</div><div class="field"><label class="hint">체육관 개방 가능 일수</label>${inp(b(k + "_y"), q[k + "_y"] ?? "", "예) 80")}</div></div>`;
  }
  return `<div class="qitem"><div class="qt">${esc(it.label)} <span class="hint">(${fmt(it.max)}점)</span></div>${it.hint ? `<p class="hint" style="margin:0 0 6px">※ ${esc(it.hint)}</p>` : ""}${body}<div class="calc" data-calc="${d.id}:${k}"></div></div>`;
}

function gradeSelect(d, gk, e) {
  const v = S(d.id).g[gk];
  return `<select data-bind="g:${d.id}:${gk}"><option value="">자체 판단</option>${e.scores.map((sc, i) => `<option value="${i}" ${String(v) === String(i) ? "selected" : ""}>${G5[i]} (${fmt(sc)})</option>`).join("")}</select>`;
}

function renderIndicator(d) {
  const st = S(d.id), sc = indScore(d), ar = AREAS[d.area - 1];
  let h = `<div class="ind-head"><div class="code">${ar.no}. ${esc(ar.name)}</div><div class="title">${d.id}. ${esc(d.title)}</div>

    <details><summary>평가 목적 보기</summary><ul style="margin:6px 0 0;padding-left:18px">${d.purpose.map(p => `<li>${esc(p)}</li>`).join("")}</ul></details></div>`;

  if (d.qual) {

      <p class="hint" style="margin:0 0 8px">주안점을 보며 스스로 등급을 골라 두면 예상 점수가 계산되고, AI가 글을 쓸 때 참고해요.</p>
      ${d.qual.elements.map((e, i) => `<div class="elem"><div class="elem-top"><b>${esc(e.name)} (${fmt(e.max)}점)</b>${gradeSelect(d, String(i), e)}</div><ul>${e.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`).join("")}
      ${d.qual.approx ? `<p class="hint">※ 이 지표는 안내서에 등급별 점수가 없어 배점 비율로 환산한 참고 점수예요.</p>` : ""}</div>`;
  }
  if (d.groups) {
    h += `<div class="card"><h3>✅ 정성 · 의견 수렴 및 환류 <span class="badge">15점</span></h3>
      ${d.groups.map(g => `<div class="group-title">${g.name} (5점)</div><ul style="margin:0 0 6px;padding-left:18px;font-size:13px;color:#4a5162">${g.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
        ${d.groupElements.map((e, i) => `<div class="elem-top"><b style="font-weight:500">${esc(e.name)} (${fmt(e.max)}점)</b>${gradeSelect(d, `${g.key}${i}`, e)}</div>`).join("")}`).join("")}</div>`;
  }
  if (d.budget) {
    h += `<div class="card"><h3>💰 학교자율과제 예산</h3><div class="grid2">
      <div class="field"><label class="hint">규모별 표준교육비 총액(천원)</label>${inp(`q:${d.id}:b_std`, st.q.b_std ?? "")}</div>
      <div class="field"><label class="hint">학교자율과제 편성 예산(천원)</label>${inp(`q:${d.id}:b_plan`, st.q.b_plan ?? "")}</div>
      <div class="field"><label class="hint">학교자율과제 집행 예산(천원)</label>${inp(`q:${d.id}:b_used`, st.q.b_used ?? "")}</div>
      <div class="field"><label class="hint">계산</label><div class="calc" data-calc="${d.id}:budget"></div></div></div>
      <p class="hint">편성률 5% 이상, 집행률 95% 이상 권장</p></div>`;
  }

  const isBusy = busy.has(d.id);
  h += `<div class="warn" data-calc="${d.id}:missing"></div>`;
  h += `<div class="card ai-box"><h3>🗒️ 올해 한 일 메모</h3>
    ${area(`memo:${d.id}`, st.memo, memoHint(d), 6)}
    <p class="hint">시기·대상·횟수, 눈에 띈 성과, 아쉬운 점, 내년에 바꿀 점을 짧게 적을수록 정확해져요. 문장으로 안 써도 돼요.</p>
    <div class="row" style="margin-top:8px">${st.memo.trim() ? "" : `<button class="ghost small" data-act="memo-tpl" data-id="${d.id}">📋 질문 틀 넣기</button>`}<button data-act="ai-one" data-id="${d.id}" ${isBusy ? "disabled" : ""}>${isBusy ? "✍️ 쓰는 중…" : "✨ AI로 이 지표 쓰기"}</button>
    ${st.prev ? `<button class="ghost small" data-act="undo" data-id="${d.id}">↩ 이전 글로 되돌리기</button>` : ""}</div></div>`;

  h += `<div class="card"><h3>📄 보고서에 들어갈 글 <span class="hint" style="font-weight:400">(한 줄 = 항목 하나)</span></h3>
    ${fieldsOf(d).map(f => `<div class="field out-field"><label>${esc(f.label)}</label>${area(`out:${d.id}:${f.key}`, st.out[f.key] || "", f.key === "future" ? "예) 학년 협의 중심의 교육과정 재구성을 확대하고 …" : "", f.key === "future" ? 2 : 4)}</div>`).join("")}
    <div class="row" style="margin-top:6px"><input id="revise-${d.id}" placeholder="고칠 점 (예: 더 짧게, 우수사례를 구체적으로, 숫자 강조)"><button class="soft" data-act="revise" data-id="${d.id}" ${isBusy ? "disabled" : ""}>🔁 다시 쓰기</button></div></div>`;
  return h;
}

function memoHint(d) {
  const ex = {
    "1-1": "예) 3·4학년 학교자율시간 '우리 마을 탐구' 운영, 학년별 교육과정 재구성 협의 월 1회, 논술형 평가 학기당 2회 + 피드백, 수업나눔 주간 5월·10월 …",
    "1-2": "예) 3월 진단평가로 학습지원대상 ○명 선정, 두드림팀 협의 ○회, 방과후 맞춤 지도(국어·수학), 학년말 ○명 중 ○명 도달, 예산 집행 ○% …",
    "1-4": "예) 교육활동 보호 안내장 3월 발송, 민원면담실 지정, 비상벨 설치, 상호존중 약속 선포식(4월) …",
    "5-3": "예) 11월 학생·교직원·학부모 설문(문항 자체 구성), 학생: 체험활동 만족 높음·독서 시간 부족 의견, 교직원: 업무 경감 요구, 학부모: 소통 창구 확대 요구 …",
  };
  return ex[d.id] || "예) 운영 시기와 대상, 주요 활동, 참여 인원·횟수, 성과(수치), 아쉬운 점, 내년 개선 방향 …";
}

function renderForm() {
  $("#form").innerHTML = state.tab === "school" ? renderSchool() : renderIndicator(IND[state.tab]);
  updateCalcs();
}

function updateCalcs() {
  document.querySelectorAll("[data-calc]").forEach(el => {
    const [id, key] = el.dataset.calc.split(":"); const d = IND[id];
    if (!d) return;
    if (key === "total") { const sc = indScore(d); el.textContent = `예상 ${sc.done ? fmt(sc.score) : "-"} / ${d.pts}점${sc.done && !sc.complete ? " (일부)" : ""}`; return; }
    if (key === "missing") { const m = indMissing(d); el.textContent = m.length ? "⚠️ 아직 안 채운 것: " + m.join(" · ") : ""; el.style.display = m.length ? "" : "none"; return; }
    if (key === "budget") {
      const q = S(id).q, A = num(q.b_std), P2 = num(q.b_plan), U = num(q.b_used);
      const t = [A && P2 !== null ? `편성률 ${r2(P2 / A * 100)}%` : "", P2 && U !== null ? `집행률 ${r2(U / P2 * 100)}%` : ""].filter(Boolean).join(" · ");
      el.textContent = t || "금액을 넣으면 계산돼요"; el.classList.toggle("empty", !t); return;
    }
    const it = d.quant.items.find(x => x.key === key);
    const r = evalQuant(it, S(id).q);
    el.textContent = r.done ? `→ ${r.value} · ${r.grade}${r.range && r.range !== r.grade ? ` (${r.range})` : ""} · ${fmt(r.score)}점` : "값을 넣으면 등급과 점수가 계산돼요";
    el.classList.toggle("empty", !r.done);
  });
}

function setBind(bind, value) {
  if (bind.startsWith("school.")) state.school[bind.slice(7)] = value;
  else if (bind.startsWith("opts.")) state.opts[bind.slice(5)] = value;
  else {
    const [kind, id, key] = bind.split(":");
    const st = S(id);
    if (kind === "q") st.q[key] = value;
    else if (kind === "g") st.g[key] = value;
    else if (kind === "memo") st.memo = value;
    else if (kind === "out") st.out[key] = value;
  }
}

// ---------- 공용 UI ----------
function toast(msg, ms = 2200) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms);
}
function confirmModal(msg, yes = "확인", alt = "") {
  return new Promise(resolve => {
    $("#modal-msg").textContent = msg; $("#modal-yes").textContent = yes;
    $("#modal-alt").textContent = alt; $("#modal-alt").style.display = alt ? "" : "none";
    $("#modal").classList.add("show");
    const done = (v) => { $("#modal").classList.remove("show"); resolve(v); };
    $("#modal-yes").onclick = () => done(true);
    $("#modal-alt").onclick = () => done("alt");
    $("#modal-no").onclick = () => done(false);
  });
}
function setStatus(msg, isErr = false) { const s = $("#status"); s.textContent = msg || ""; s.classList.toggle("err", isErr); }
function setProgress(done, total) { $("#progress .bar").style.width = total ? `${Math.round(done / total * 100)}%` : "0"; }

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
    ta.remove(); return ok;
  }
}

function refreshAll() { renderTabs(); renderForm(); renderPreview(); renderRev(); save(); }

// ---------- AI 실행 ----------
async function runOne(id, instruction) {
  if (busy.has(id)) return;
  busy.add(id); if (state.tab === id) renderForm();
  setStatus(`${id} 지표를 쓰는 중…`);
  try {
    await aiWrite(id, instruction);
    setStatus(`${id} 지표를 썼어요. ○○ 표시는 직접 채워 주세요.`);
  } catch (e) {
    setStatus(`${id}: ${e.message}`, true);
  } finally {
    busy.delete(id);
    renderTabs(); if (state.tab === id) renderForm(); renderPreview(); save();
  }
}

async function runAll() {
  const targets = INDICATORS.filter(d => fieldsOf(d).every(f => !(S(d.id).out[f.key] || "").trim()));
  if (!targets.length) { toast("빈 지표가 없어요. 지표별로 '다시 쓰기'를 이용하세요."); return; }
  const ready = targets.filter(d => memoText(S(d.id).memo) || indScore(d).done);
  const bare = targets.length - ready.length;
  if (bare) {
    const msg = `빈 지표 ${targets.length}개 중 ${bare}개는 메모도 실적도 없어요.\n그런 지표는 학교 사실을 알 수 없어서 ○○ 빈칸이 많은 틀 문장만 나와요.\n메모를 먼저 채우는 것을 추천해요.`;
    const ans = ready.length ? await confirmModal(msg, `메모·실적 넣은 ${ready.length}개만 쓰기`, "전부 쓰기") : await confirmModal(msg, "그래도 전부 쓰기");
    if (!ans) return;
    if (ans === true && ready.length) targets.splice(0, targets.length, ...ready);
  }
  let done = 0, next = 0;
  const failed = [];
  setProgress(0, targets.length);
  const worker = async () => {
    while (next < targets.length) {
      const d = targets[next++];
      busy.add(d.id);
      setStatus(`AI가 보고서를 쓰는 중… ${done}/${targets.length}`);
      try { await aiWrite(d.id); } catch (e) { failed.push(`${d.id}(${e.message.replace(/\.? ?다시.*$/, "")})`); }
      busy.delete(d.id); done++;
      setProgress(done, targets.length);
      renderTabs(); renderPreview(); save();
      if (state.tab === d.id) renderForm();
    }
  };
  await Promise.all(Array.from({ length: Math.min(2, targets.length) }, worker));
  setProgress(0, 0);
  setStatus(failed.length ? `${targets.length - failed.length}개 완료, ${failed.length}개 실패: ${failed.join(", ")} — '빈 지표 AI로 모두 쓰기'를 다시 누르면 실패한 것만 다시 써요.` : `${targets.length}개 지표를 모두 썼어요. 미리보기에서 블록을 눌러 고치거나 ○○를 채우세요.`, !!failed.length);
}

// ---------- 블록 고치기 ----------
function blkLabel(k) {
  const [id, bk] = k.split(":");
  const b = blocksOf(IND[id]).find(x => x.key === bk);
  return `${id} ${b ? b.label : bk}`;
}
function renderRev() {
  const n = sel.size;
  $("#rev").classList.toggle("empty", !n);
  $("#rev-hint").textContent = n ? `${n}개 블록 선택됨` : "미리보기에서 고칠 부분(블록)을 눌러 선택하세요. 여러 개 고를 수 있어요.";
  $("#rev-clear").style.display = n ? "" : "none";
  $("#rev-chips").innerHTML = [...sel].map(k => `<span class="chip">${esc(blkLabel(k))}<button data-act="rev-del" data-k="${k}" aria-label="선택 빼기">×</button></span>`).join("");
  $("#rev-undo").style.display = lastRev.length ? "" : "none";
  $("#rev-go").disabled = !n || revBusy.size > 0;
  $("#rev-go").textContent = revBusy.size ? "✍️ 고치는 중…" : "✨ 선택 블록 고쳐 쓰기";
}
async function reviseBlocks(instruction) {
  const keys = [...sel];
  if (!keys.length || revBusy.size) return;
  const byInd = {};
  keys.forEach(k => { const [id, bk] = k.split(":"); (byInd[id] ||= []).push(bk); });
  keys.forEach(k => revBusy.add(k));
  renderPreview(); renderRev();
  setStatus(`선택한 블록 ${keys.length}개를 고치는 중…`);
  const ids = Object.keys(byInd), failed = [], ok = [];
  let next = 0;
  const worker = async () => {
    while (next < ids.length) {
      const id = ids[next++];
      try { await aiWriteBlocks(id, byInd[id], instruction); ok.push(id); }
      catch (e) { failed.push(`${id}(${e.message.replace(/\.? ?다시.*$/, "")})`); }
      byInd[id].forEach(bk => revBusy.delete(`${id}:${bk}`));
      renderPreview();
    }
  };
  await Promise.all(Array.from({ length: Math.min(2, ids.length) }, worker));
  lastRev = ok;
  $("#rev-input").value = "";
  renderTabs(); renderForm(); renderPreview(); renderRev(); save();
  setStatus(failed.length ? `일부 실패: ${failed.join(", ")} — 다시 눌러 주세요.` : `블록 ${keys.length}개를 고쳤어요. 마음에 안 들면 '방금 고친 것 되돌리기'를 누르세요.`, !!failed.length);
}

// ---------- 예시 ----------
function loadSample() {
  state = defaultState();
  Object.assign(state.school, {
    name: "○○초등학교", slogan: "꿈 · 도전 · 어울림", year: "2026", principal: "김○○", vice: "이○○",
    address: "경기도 ○○시 ○○로 123", classes: "18학급", students: "412",
    vision: "비전: 함께 꿈꾸고 스스로 성장하는 행복한 배움터\n교육 목표: 바른 인성을 갖춘 어린이, 스스로 탐구하는 어린이, 함께 어울리는 어린이",
  });
  const set = (id, o) => Object.assign(S(id), o);
  set("1-1", { q: { q1: "0", q2_a: "28", q2_b: "24", q3: "0" }, g: { 0: "1", 1: "0", 2: "1" },
    memo: "3·4학년 학교자율시간 '우리 고장 탐험대' 운영(주 1시간). 학년별 교육과정 재구성 협의 월 1회. 학기별 논술형 평가 2회 + 개별 피드백. 5월·10월 수업나눔 주간에 전 교원 공개수업. 학년 말 교육과정 평가회에서 체험 중심 수업 만족 높음, 평가 결과 활용은 부족하다는 의견." });
  set("1-2", { g: { 0: "1", 1: "1", 2: "1" },
    memo: "3월 진단평가와 교사 관찰로 학습지원대상 14명 선정. 두드림팀 협의 학기별 2회. 방과후 국어·수학 맞춤 지도 주 2회, 협력교사 수업 지원(1·2학년). 학년말 재진단에서 14명 중 10명 도달. 예산 집행 96%. 학부모 상담 연계가 약했음." });
  set("3-2", { q: { q1_a: "28", q1_b: "26" }, memo: "전문적학습공동체(학년별) 연계 연수, 원격연수 이수 독려. 30시간 미달 2명은 휴직 복귀자." });
  set("5-3", { g: { s0: "0", s1: "1", s2: "1", t0: "1", t1: "1", t2: "1", p0: "1", p1: "2", p2: "1" },
    memo: "11월 학생(4~6학년)·교직원·학부모 설문 실시, 문항은 학교자율과제와 교육활동에 맞게 자체 구성. 학생: 체험활동 만족 높음, 쉬는 시간·독서 시간 부족 의견. 교직원: 업무 경감과 협의 시간 확보 요구. 학부모: 학교 소식 안내 만족, 상담 시간 선택 폭 확대 요구." });
  state.tab = "1-1";
  refreshAll();
  toast("예시 학교 내용을 불러왔어요. 지표에서 ✨ AI로 쓰기를 눌러 보세요.");
}

// ============================================================
//  9. 이벤트
// ============================================================
document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-bind]");
  if (!el) return;
  const v = el.type === "checkbox" ? el.checked : el.value;
  setBind(el.dataset.bind, v);
  updateCalcs(); save(); schedulePreview();
  if (el.dataset.bind.startsWith("memo:") || el.dataset.bind.startsWith("out:")) { clearTimeout(renderTabs._t); renderTabs._t = setTimeout(renderTabs, 600); }
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-bind]");
  if (el && (el.tagName === "SELECT" || el.type === "checkbox")) { setBind(el.dataset.bind, el.type === "checkbox" ? el.checked : el.value); updateCalcs(); renderPreview(); renderTabs(); save(); }
});

document.addEventListener("click", async (e) => {
  if (!e.target.closest(".menu")) $("#menu").classList.remove("show");
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; renderTabs(); renderForm(); renderPreview(); save(); $("#form").scrollTop = 0; return; }
  const blkEl = e.target.closest("#preview [data-blk]");
  if (blkEl) {
    const k = blkEl.dataset.blk, id = k.split(":")[0];
    if (sel.has(k)) sel.delete(k); else sel.add(k);
    document.querySelectorAll("#preview [data-blk]").forEach(x => x.classList.toggle("on", sel.has(x.dataset.blk)));
    renderRev();
    if (state.tab !== id && !document.body.classList.contains("show-preview")) { state.tab = id; renderTabs(); renderForm(); save(); }
    return;
  }
  const sec = e.target.closest(".ind-sec");
  if (sec) {
    state.tab = sec.dataset.ind; renderTabs(); renderForm(); save();
    document.querySelectorAll(".ind-sec").forEach(x => x.classList.toggle("sel", x.dataset.ind === state.tab));
    if (document.body.classList.contains("show-preview")) { document.body.classList.remove("show-preview"); $("[data-act=switch]").textContent = "📄 미리보기"; }
    $("#form").scrollTop = 0; return;
  }
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act, id = btn.dataset.id;
  if (act === "menu") { $("#menu").classList.toggle("show"); return; }
  if (act === "switch") {
    const on = document.body.classList.toggle("show-preview");
    btn.textContent = on ? "✏️ 입력하기" : "📄 미리보기"; window.scrollTo(0, 0); return;
  }
  if (act === "ai-one") return runOne(id);
  if (act === "rev-quick") { const i = $("#rev-input"); i.value = i.value.trim() ? `${i.value.trim()}, ${btn.dataset.q}` : btn.dataset.q; i.focus(); return; }
  if (act === "rev-del") { sel.delete(btn.dataset.k); renderPreview(); renderRev(); return; }
  if (act === "rev-clear") { sel.clear(); renderPreview(); renderRev(); return; }
  if (act === "rev-go") return reviseBlocks($("#rev-input").value.trim());
  if (act === "rev-undo") {
    lastRev.forEach(i => { const st = S(i); if (st.prev) { const cur = st.out; st.out = st.prev; st.prev = cur; } });
    lastRev = []; refreshAll(); renderRev(); toast("방금 고친 내용을 되돌렸어요."); return;
  }
  if (act === "memo-tpl") {
    S(id).memo = "■ 올해 한 일(시기·대상·횟수):\n■ 눈에 띈 성과(숫자·변화):\n■ 아쉬웠던 점:\n■ 내년에 바꿀 점:\n";
    renderForm(); save();
    const ta = document.querySelector(`[data-bind="memo:${id}"]`); if (ta) { ta.focus(); ta.setSelectionRange(17, 17); }
    return;
  }
  if (act === "revise") {
    const v = ($(`#revise-${id}`)?.value || "").trim();
    if (!v) return toast("고칠 점을 적어 주세요.");
    return runOne(id, v);
  }
  if (act === "undo") {
    const st = S(id); if (!st.prev) return;
    const cur = st.out; st.out = st.prev; st.prev = cur;
    refreshAll(); toast("이전 글로 되돌렸어요. 한 번 더 누르면 다시 바뀌어요.");
    return;
  }
  if (act === "ai-all") return runAll();
  if (act === "hwpx") {
    const miss = allMissing();
    if (miss.length) {
      const shown = miss.slice(0, 10).join("\n") + (miss.length > 10 ? `\n… 외 ${miss.length - 10}곳` : "");
      if (!(await confirmModal(`아직 채우지 않은 곳이 있어요.\n\n${shown}\n\n그래도 지금 상태로 저장할까요?`, "그래도 저장"))) return;
    }
    btn.disabled = true;
    try {
      const blob = await buildHwpx();
      const name = `${state.school.year || "2026"}학년도_학교평가_보고서_${state.school.name || "학교"}`.replace(/[\\/:*?"<>|\s]+/g, "_");
      saveBlob(blob, `${name}.hwpx`);
      toast("한글 파일을 내려받았어요. 한글(2018 이상)에서 열어 확인하세요.", 3200);
    } catch (err) { setStatus("한글 파일을 만들지 못했어요: " + err.message, true); }
    btn.disabled = false; return;
  }
  if (act === "copy") { const ok = await copyText(docPlainText()); toast(ok ? "보고서 글 전체를 복사했어요." : "복사가 막혔어요. 한글 파일 저장을 이용해 주세요."); return; }
  if (act === "sample") {
    const has = state.school.name || Object.values(state.ind).some(x => x.memo.trim() || Object.values(x.out).some(v => String(v).trim()) || Object.keys(x.q).length || Object.keys(x.g).length);
    if (has && !(await confirmModal("지금 입력한 내용이 예시로 바뀝니다. 계속할까요?\n(필요하면 먼저 '작업 백업 파일 저장'을 하세요)"))) return;
    return loadSample();
  }
  if (act === "backup") {
    saveBlob(new Blob([JSON.stringify(state, null, 1)], { type: "application/json" }), `학교평가보고서_백업_${new Date().toISOString().slice(0, 10)}.json`);
    toast("백업 파일을 저장했어요."); return;
  }
  if (act === "restore") { $("#file-restore").click(); return; }
  if (act === "reset") {
    if (!(await confirmModal("입력한 내용을 모두 지우고 처음부터 시작할까요?", "모두 지우기"))) return;
    state = defaultState(); refreshAll(); toast("처음 상태로 돌아갔어요."); return;
  }
});

$("#file-restore").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !data.school || !data.ind) throw new Error();
    state = Object.assign(defaultState(), data); refreshAll(); toast("백업을 불러왔어요.");
  } catch (err) { toast("백업 파일을 읽지 못했어요."); }
  e.target.value = "";
});

refreshAll();
</script>
